apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-demo-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Arpit20261202/terraform-aws-devops-project.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true